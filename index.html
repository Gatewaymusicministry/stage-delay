<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rane AD 22d Stage Delay &amp; Monitor Reflection Calculator</title>
<style>
  :root {
    --bg-main: #0b0e14;
    --bg-card: #131822;
    --bg-panel: #1a2130;
    --bg-input: #0e121a;
    --border: #283347;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-cyan: #06b6d4;
    --accent-cyan-glow: rgba(6, 182, 212, 0.25);
    --accent-amber: #f59e0b;
    --accent-emerald: #10b981;
    --accent-rose: #f43f5e;
    --accent-indigo: #6366f1;
    --accent-violet: #a855f7;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.45;
    padding: 16px;
    padding-bottom: 56px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 0 16px var(--accent-cyan-glow);
  }

  .brand h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .brand span {
    display: block;
    font-size: 0.72rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .toggle-pill {
    display: inline-flex;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .toggle-pill button {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .toggle-pill button.active {
    background: var(--accent-cyan);
    color: #06131a;
  }

  /* Environment Bar */
  .env-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: center;
  }

  @media (max-width: 580px) {
    .env-bar {
      grid-template-columns: 1fr;
    }
  }

  .temp-control label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .temp-control label strong {
    color: var(--accent-cyan);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent-cyan);
    height: 6px;
    background: var(--bg-input);
    border-radius: 4px;
    cursor: pointer;
  }

  .speed-stat {
    background: var(--bg-panel);
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    text-align: right;
  }

  .speed-stat span {
    display: block;
    font-size: 0.66rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.6px;
  }

  .speed-stat strong {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem;
    color: var(--text-primary);
  }

  /* Rane AD 22d Hardware Readout Card */
  .rane-card {
    background: linear-gradient(180deg, #161e2e 0%, #0f141e 100%);
    border: 2px solid var(--accent-cyan);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 0 24px rgba(6, 182, 212, 0.12);
  }

  .rane-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-wrap: wrap;
  }

  .rane-title {
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent-cyan);
    font-weight: 800;
  }

  .rane-sub {
    font-size: 0.78rem;
    color: var(--text-secondary);
  }

  .copy-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }

  .copy-btn:active {
    transform: scale(0.97);
  }

  .channel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 580px) {
    .channel-grid {
      grid-template-columns: 1fr;
    }
  }

  .ch-box {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .ch-box.active-delay {
    border-color: var(--accent-cyan);
    background: rgba(6, 182, 212, 0.06);
  }

  .ch-box.bypass-box {
    border-color: rgba(16, 185, 129, 0.45);
  }

  .ch-box.fill-box {
    grid-column: 1 / -1;
    border-color: var(--accent-amber);
    background: rgba(245, 158, 11, 0.06);
  }

  .ch-box.monitor-box {
    grid-column: 1 / -1;
    border-color: var(--accent-violet);
    background: rgba(168, 85, 247, 0.07);
  }

  .ch-tag {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .ch-box.active-delay .ch-tag {
    color: var(--accent-cyan);
  }

  .ch-box.bypass-box .ch-tag {
    color: var(--accent-emerald);
  }

  .ch-box.fill-box .ch-tag {
    color: var(--accent-amber);
  }

  .ch-box.monitor-box .ch-tag {
    color: var(--accent-violet);
  }

  .ch-readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.9rem;
    font-weight: 800;
    color: #fff;
    line-height: 1.15;
    margin: 4px 0;
  }

  .ch-box.bypass-box .ch-readout {
    color: var(--accent-emerald);
  }

  .ch-box.fill-box .ch-readout {
    color: var(--accent-amber);
  }

  .ch-box.monitor-box .ch-readout {
    color: var(--accent-violet);
    font-size: 1.65rem;
  }

  .ch-desc {
    font-size: 0.76rem;
    color: var(--text-secondary);
    line-height: 1.45;
  }

  .routing-banner {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(6, 182, 212, 0.08);
    border: 1px solid rgba(6, 182, 212, 0.3);
    border-radius: 9px;
    font-size: 0.76rem;
    color: #cffafe;
    line-height: 1.45;
  }

  .mon-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 8px 0;
  }

  @media (max-width: 580px) {
    .mon-metrics {
      grid-template-columns: 1fr;
    }
  }

  .mon-stat {
    background: rgba(15, 20, 30, 0.75);
    border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .mon-stat span {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
